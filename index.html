<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Puzzle Challenge - English Learning Game</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            position: relative;
        }

        /* Lives Display */
        .lives-display {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }

        .heart-icon {
            font-size: 2em;
            transition: all 0.5s ease;
            animation: heartBeat 1s infinite;
        }

        .heart-icon.lost {
            opacity: 0.2;
            animation: none;
            filter: grayscale(100%);
        }

        .heart-icon.breaking {
            animation: heartBreak 0.6s ease-out;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.3); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        @keyframes heartBreak {
            0% { transform: scale(1); opacity: 1; }
            25% { transform: scale(1.4); opacity: 0.8; }
            50% { transform: scale(0.8) rotate(15deg); opacity: 0.6; }
            75% { transform: scale(1.2) rotate(-15deg); opacity: 0.3; }
            100% { transform: scale(0.5); opacity: 0; }
        }

        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        .screen-shaking {
            animation: screenShake 0.6s ease;
        }

        @keyframes redFlash {
            0%, 100% { background-color: transparent; }
            50% { background-color: rgba(255, 0, 0, 0.1); }
        }

        .red-flash {
            animation: redFlash 0.6s ease;
        }

        /* Game Over Overlay */
        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .game-over-modal {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: slideDown 0.5s ease;
        }

        .game-over-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: float 2s infinite;
        }

        .game-over-title {
            font-size: 2em;
            color: #dc3545;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .game-over-stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .game-over-stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .game-over-stat:last-child {
            border-bottom: none;
        }

        /* Welcome Page Styles */
        .welcome-page {
            text-align: center;
        }

        .welcome-title {
            font-size: 2.5em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            animation: slideDown 0.8s ease;
        }

        .welcome-subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 40px;
            animation: fadeIn 1s ease 0.3s both;
        }

        .welcome-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .mode-selection {
            margin: 30px 0;
            animation: fadeIn 1s ease 0.5s both;
        }

        .mode-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .mode-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-card {
            background: #f8f9fa;
            border: 3px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .mode-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .mode-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f3ff 0%, #e8ecff 100%);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .mode-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .mode-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .mode-description {
            font-size: 0.9em;
            color: #666;
            line-height: 1.6;
        }

        .difficulty-section {
            margin: 30px 0;
            animation: fadeIn 1s ease 0.7s both;
        }

        .difficulty-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .difficulty-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .difficulty-card {
            background: #f8f9fa;
            border: 3px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .difficulty-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .difficulty-card.selected {
            color: white;
        }

        .difficulty-card.easy-selected {
            background: linear-gradient(135deg, #48c774 0%, #3ec96d 100%);
            border-color: #48c774;
            animation: pulse 1s infinite;
        }

        .difficulty-card.normal-selected {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4a 100%);
            border-color: #ffd700;
            color: #333;
            animation: pulse 0.8s infinite;
        }

        .difficulty-card.hard-selected {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border-color: #ff6b6b;
            animation: shake 0.5s infinite;
        }

        .difficulty-card.practice-selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            animation: float 2s infinite;
        }

        .difficulty-icon {
            font-size: 2em;
            display: block;
            margin-bottom: 10px;
        }

        .difficulty-name {
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 5px;
        }

        .difficulty-hints {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .difficulty-lives {
            font-size: 0.8em;
            margin-top: 5px;
        }

        .difficulty-stars {
            color: #ffd700;
            font-size: 1.2em;
            margin-top: 5px;
        }

        .start-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            animation: fadeIn 1s ease 0.9s both;
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .start-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Game Page Styles */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .game-title-small {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
        }

        .exit-button {
            background: #f8d7da;
            color: #721c24;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .exit-button:hover {
            background: #f5c6cb;
            transform: scale(1.05);
        }

        .mode-indicator {
            background: #e8f4f8;
            color: #667eea;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .score-section {
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.8em;
            color: #666;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .main-word {
            text-align: center;
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .scrambled-letters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .letter-tile {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .letter-tile:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .letter-tile.selected {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: scale(1.1);
            animation: sparkle 0.5s ease;
        }

        .letter-tile.hint-highlight {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4a 100%);
            animation: sparkle 0.5s ease;
            color: #333;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .word-chain-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chain-word {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            animation: slideIn 0.5s ease;
        }

        .chain-arrow {
            color: #667eea;
            font-weight: bold;
            font-size: 1.2em;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .word-display {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            min-height: 50px;
            align-items: center;
        }

        .word-letter {
            width: 40px;
            height: 40px;
            border-bottom: 3px solid #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .word-letter.hint-letter {
            color: #ffd700;
            border-bottom-color: #ffd700;
            animation: sparkle 0.5s ease;
        }

        .found-words {
            margin-top: 20px;
        }

        .found-words-title {
            font-size: 1.1em;
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .words-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .found-word-item {
            background: #e8f4f8;
            padding: 8px 12px;
            border-radius: 20px;
            text-align: center;
            font-weight: 500;
            color: #667eea;
            animation: fadeIn 0.5s ease;
            font-size: 0.9em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .game-button {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .check-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .check-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .check-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-button {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #ddd;
        }

        .clear-button:hover {
            background: #e9ecef;
        }

        .hint-button {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4a 100%);
            color: #333;
        }

        .hint-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .hint-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            animation: shake 0.5s ease;
        }

        .info-message {
            background: #d1ecf1;
            color: #0c5460;
        }

        .warning-message {
            background: #fff3cd;
            color: #856404;
            animation: pulse 1s ease;
        }

        .level-complete {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            text-align: center;
            padding: 30px;
            border-radius: 10px;
        }

        .level-complete h2 {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .stat-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        .stat-label {
            font-size: 0.8em;
            color: #666;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .chain-info {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .start-letter {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
        }

        /* Final Score Page */
        .final-score-page {
            text-align: center;
            animation: slideDown 0.8s ease;
        }

        .final-score-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        .final-score-value {
            font-size: 3em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        .final-stats {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .final-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .final-stat-row:last-child {
            border-bottom: none;
        }

        .return-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .return-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .game-container {
                padding: 20px;
            }

            .welcome-title {
                font-size: 1.8em;
            }

            .mode-cards {
                grid-template-columns: 1fr;
            }

            .difficulty-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .letter-tile {
                width: 40px;
                height: 40px;
                font-size: 1.2em;
            }

            .score-section {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <word-puzzle-game></word-puzzle-game>
    </div>

    <script type="text/x-template" id="word-puzzle-template">
        <div :class="['game-container', { 'screen-shaking': isShaking, 'red-flash': isFlashing }]">
            <!-- WELCOME PAGE -->
            <div v-if="currentPage === 'welcome'" class="welcome-page">
                <div class="welcome-icon">🎮</div>
                <h1 class="welcome-title">Welcome to English Word Games!</h1>
                <p class="welcome-subtitle">Learn English while having fun with exciting word puzzles</p>
                
                <div class="mode-selection">
                    <h2 class="mode-title">📋 Select Game Mode</h2>
                    <div class="mode-cards">
                        <div 
                            :class="['mode-card', { selected: selectedMode === 'crossword' }]"
                            @click="selectedMode = 'crossword'"
                        >
                            <span class="mode-icon">📝</span>
                            <h3 class="mode-name">Crossword Connect</h3>
                            <p class="mode-description">
                                Find all possible words from scrambled letters. 
                                Test your vocabulary and spelling skills!
                            </p>
                        </div>
                        <div 
                            :class="['mode-card', { selected: selectedMode === 'wordchain' }]"
                            @click="selectedMode = 'wordchain'"
                        >
                            <span class="mode-icon">🔗</span>
                            <h3 class="mode-name">Word Chain</h3>
                            <p class="mode-description">
                                Create a chain of words where each new word 
                                starts with the last letter of the previous word!
                            </p>
                        </div>
                    </div>
                </div>

                <div v-if="selectedMode" class="difficulty-section">
                    <h2 class="difficulty-title">🎯 Select Difficulty Level</h2>
                    <div class="difficulty-cards">
                        <div 
                            :class="['difficulty-card', { 
                                'practice-selected': selectedDifficulty === 'practice' 
                            }]"
                            @click="selectedDifficulty = 'practice'"
                        >
                            <span class="difficulty-icon">🌟</span>
                            <div class="difficulty-name">Practice</div>
                            <div class="difficulty-hints">∞ Hints</div>
                            <div class="difficulty-lives">∞ Lives</div>
                            <div class="difficulty-stars">⭐</div>
                        </div>
                        <div 
                            :class="['difficulty-card', { 
                                'easy-selected': selectedDifficulty === 'easy' 
                            }]"
                            @click="selectedDifficulty = 'easy'"
                        >
                            <span class="difficulty-icon">😊</span>
                            <div class="difficulty-name">Easy</div>
                            <div class="difficulty-hints">10 Hints</div>
                            <div class="difficulty-lives">7 Lives</div>
                            <div class="difficulty-stars">⭐⭐</div>
                        </div>
                        <div 
                            :class="['difficulty-card', { 
                                'normal-selected': selectedDifficulty === 'normal' 
                            }]"
                            @click="selectedDifficulty = 'normal'"
                        >
                            <span class="difficulty-icon">😎</span>
                            <div class="difficulty-name">Normal</div>
                            <div class="difficulty-hints">5 Hints</div>
                            <div class="difficulty-lives">5 Lives</div>
                            <div class="difficulty-stars">⭐⭐⭐</div>
                        </div>
                        <div 
                            :class="['difficulty-card', { 
                                'hard-selected': selectedDifficulty === 'hard' 
                            }]"
                            @click="selectedDifficulty = 'hard'"
                        >
                            <span class="difficulty-icon">🔥</span>
                            <div class="difficulty-name">Hard</div>
                            <div class="difficulty-hints">3 Hints</div>
                            <div class="difficulty-lives">3 Lives</div>
                            <div class="difficulty-stars">⭐⭐⭐⭐</div>
                        </div>
                    </div>
                </div>

                <button 
                    class="start-button" 
                    @click="startGame"
                    :disabled="!selectedMode || !selectedDifficulty"
                >
                    🚀 Start Game!
                </button>
            </div>

            <!-- GAME PAGE -->
            <div v-if="currentPage === 'game'">
                <div class="game-header">
                    <div>
                        <h1 class="game-title-small">
                            {{ gameMode === 'crossword' ? '📝 Crossword Connect' : '🔗 Word Chain' }}
                        </h1>
                        <span class="mode-indicator">
                            {{ difficulties[gameDifficulty].label }} Mode
                        </span>
                    </div>
                    <button class="exit-button" @click="exitToHome">
                        ✕ Exit Game
                    </button>
                </div>

                <!-- Lives Display -->
                <div class="lives-display">
                    <span 
                        v-for="(life, index) in maxLives" 
                        :key="index"
                        :class="['heart-icon', { 
                            lost: index >= currentLives,
                            breaking: breakingHeartIndex === index 
                        }]"
                    >
                        ❤️
                    </span>
                </div>

                <div class="score-section">
                    <div class="score-item">
                        <div class="score-label">Level</div>
                        <div class="score-value">{{ currentLevel }}</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Score</div>
                        <div class="score-value">{{ score }}</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Progress</div>
                        <div class="score-value">{{ progressDisplay }}</div>
                    </div>
                    <div class="score-item">
                        <div class="score-label">Hints</div>
                        <div class="score-value">{{ gameDifficulty === 'practice' ? '∞' : hints }}</div>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" :style="{width: progressPercentage + '%'}"></div>
                </div>

                <div v-if="levelComplete">
                    <div class="level-complete">
                        <h2>🎉 Level Complete!</h2>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div class="stat-label">Words Found</div>
                                <div class="stat-value">{{ foundWords.length }}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Total Score</div>
                                <div class="stat-value">{{ score }}</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Lives Left</div>
                                <div class="stat-value">{{ currentLives }} ❤️</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">Difficulty</div>
                                <div class="stat-value">{{ difficulties[gameDifficulty].label }}</div>
                            </div>
                        </div>
                        <button class="game-button check-button" @click="nextLevel">
                            Next Level ➡️
                        </button>
                    </div>
                </div>

                <div v-else>
                    <div v-if="gameMode === 'wordchain' && chainWords.length > 0" class="word-chain-display">
                        <span v-for="(word, index) in chainWords" :key="index">
                            <span class="chain-word">{{ word }}</span>
                            <span v-if="index < chainWords.length - 1" class="chain-arrow">→</span>
                        </span>
                    </div>

                    <div class="main-word">
                        <p v-if="gameMode === 'crossword'" style="color: #666; margin-bottom: 10px;">
                            Create words using these letters (each letter can be used multiple times):
                        </p>
                        <p v-else style="color: #666; margin-bottom: 10px;">
                            Create a word chain! Letters can be reused. Next word must start with last letter
                        </p>
                        <p v-if="gameMode === 'wordchain' && chainWords.length > 0" class="chain-info">
                            Last letter: <span class="start-letter">{{ lastChainLetter }}</span>
                        </p>
                        <div class="scrambled-letters">
                            <div 
                                v-for="(letter, index) in scrambledLetters" 
                                :key="index"
                                :class="['letter-tile', { 
                                    selected: selectedIndices.includes(index),
                                    'hint-highlight': hintHighlightIndices.includes(index)
                                }]"
                                @click="selectLetter(index)"
                            >
                                {{ letter }}
                            </div>
                        </div>
                    </div>

                    <div class="word-display">
                        <div 
                            v-for="(letter, index) in currentWord" 
                            :key="index" 
                            :class="['word-letter', { 'hint-letter': hintLetterIndices.includes(index) }]"
                        >
                            {{ letter }}
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="game-button check-button" @click="checkWord" :disabled="currentWord.length === 0">
                            ✓ Check Word
                        </button>
                        <button class="game-button clear-button" @click="clearSelection">
                            ✕ Clear
                        </button>
                        <button 
                            class="game-button hint-button" 
                            @click="useHint" 
                            :disabled="gameDifficulty !== 'practice' && hints === 0"
                        >
                            💡 Hint ({{ gameDifficulty === 'practice' ? '∞' : hints }})
                        </button>
                    </div>

                    <div v-if="message" :class="['message', messageType + '-message']">
                        {{ message }}
                    </div>

                    <div class="found-words" v-if="gameMode === 'crossword' && foundWords.length > 0">
                        <h3 class="found-words-title">Words Found:</h3>
                        <div class="words-grid">
                            <div v-for="(word, index) in foundWords" :key="index" class="found-word-item">
                                {{ word }}
                            </div>
                        </div>
                    </div>

                    <div v-if="gameMode === 'wordchain' && chainWords.length > 0" class="found-words">
                        <h3 class="found-words-title">Chain Length: {{ chainWords.length }} words</h3>
                        <div class="words-grid">
                            <div v-for="(word, index) in chainWords" :key="index" class="found-word-item">
                                {{ index + 1 }}. {{ word }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FINAL SCORE PAGE -->
            <div v-if="currentPage === 'finalScore'" class="final-score-page">
                <div class="final-score-icon">{{ gameOver ? '💔' : '🏆' }}</div>
                <h1>{{ gameOver ? 'Game Over!' : 'Game Finished!' }}</h1>
                <p style="color: #666; margin-top: 10px;">Here's your final result</p>
                
                <div class="final-score-value">{{ finalScore }}</div>
                
                <div class="final-stats">
                    <div class="final-stat-row">
                        <span>🎮 Game Mode</span>
                        <strong>{{ finalStats.mode === 'crossword' ? 'Crossword Connect' : 'Word Chain' }}</strong>
                    </div>
                    <div class="final-stat-row">
                        <span>📊 Difficulty</span>
                        <strong>{{ finalStats.difficulty }}</strong>
                    </div>
                    <div class="final-stat-row">
                        <span>📈 Levels Completed</span>
                        <strong>{{ finalStats.levelsCompleted }}</strong>
                    </div>
                    <div class="final-stat-row">
                        <span>📝 Words Found</span>
                        <strong>{{ finalStats.totalWords }}</strong>
                    </div>
                    <div class="final-stat-row">
                        <span>❤️ Lives Remaining</span>
                        <strong>{{ finalStats.livesRemaining }}</strong>
                    </div>
                    <div class="final-stat-row">
                        <span>💡 Hints Used</span>
                        <strong>{{ finalStats.hintsUsed }}</strong>
                    </div>
                    <div class="final-stat-row">
                        <span>⭐ Performance</span>
                        <strong>{{ finalStats.performance }}</strong>
                    </div>
                </div>

                <button class="return-button" @click="returnToHome">
                    🏠 Return to Home
                </button>
            </div>

            <!-- Game Over Overlay -->
            <div v-if="showGameOver" class="game-over-overlay" @click="showGameOver = false">
                <div class="game-over-modal" @click.stop>
                    <div class="game-over-icon">💔</div>
                    <h2 class="game-over-title">Game Over!</h2>
                    <p style="color: #666;">You've lost all your lives!</p>
                    <div class="game-over-stats">
                        <div class="game-over-stat">
                            <span>Score</span>
                            <strong>{{ score }}</strong>
                        </div>
                        <div class="game-over-stat">
                            <span>Level Reached</span>
                            <strong>{{ currentLevel }}</strong>
                        </div>
                        <div class="game-over-stat">
                            <span>Words Found</span>
                            <strong>{{ totalWordsFound }}</strong>
                        </div>
                    </div>
                    <button class="return-button" @click="exitToHome">
                        View Final Score
                    </button>
                </div>
            </div>
        </div>
    </script>

    <script>
        const { createApp } = Vue;

        const WordPuzzleGame = {
            template: '#word-puzzle-template',
            data() {
                return {
                    currentPage: 'welcome',
                    selectedMode: null,
                    selectedDifficulty: null,
                    gameMode: '',
                    gameDifficulty: '',
                    difficulties: {
                        practice: { label: 'Practice', hints: Infinity, lives: Infinity },
                        easy: { label: 'Easy', hints: 10, lives: 7 },
                        normal: { label: 'Normal', hints: 5, lives: 5 },
                        hard: { label: 'Hard', hints: 3, lives: 3 }
                    },
                    currentLevel: 1,
                    score: 0,
                    hints: 0,
                    initialHints: 0,
                    hintsUsed: 0,
                    maxLives: 5,
                    currentLives: 5,
                    totalWordsFound: 0,
                    levelsCompleted: 0,
                    mainWord: '',
                    scrambledLetters: [],
                    targetWords: [],
                    foundWords: [],
                    chainWords: [],
                    currentWord: [],
                    selectedIndices: [],
                    hintHighlightIndices: [],
                    hintLetterIndices: [],
                    message: '',
                    messageType: '',
                    levelComplete: false,
                    gameOver: false,
                    showGameOver: false,
                    isShaking: false,
                    isFlashing: false,
                    breakingHeartIndex: -1,
                    maxChainLength: 5,
                    finalScore: 0,
                    finalStats: {
                        mode: '',
                        difficulty: '',
                        levelsCompleted: 0,
                        totalWords: 0,
                        hintsUsed: 0,
                        livesRemaining: 0,
                        performance: ''
                    },
                    crosswordDatabase: [
                        {
                            mainWord: 'HEART',
                            words: ['HE', 'HEAR', 'HEART', 'ART', 'EAR', 'EAT', 'HER', 'HAT', 'ARE', 'THE']
                        },
                        {
                            mainWord: 'PLANT',
                            words: ['PLAN', 'PLANT', 'ANT', 'PAN', 'TAN', 'TAP', 'NAP', 'LAP', 'PAL']
                        },
                        {
                            mainWord: 'STORM',
                            words: ['STORM', 'MOST', 'SORT', 'ROT', 'TOM', 'OR', 'TO', 'SO']
                        },
                        {
                            mainWord: 'BRIGHT',
                            words: ['BRIGHT', 'RIGHT', 'BIT', 'BIG', 'HIT', 'RIG', 'IT']
                        },
                        {
                            mainWord: 'BEAUTY',
                            words: ['BEAUTY', 'BEAT', 'BEAU', 'BET', 'BUT', 'BYE', 'EAT', 'TAB', 'TUB', 'YET', 'BUY', 'BAY']
                        }
                    ],
                    wordChainDatabase: [
                        {
                            startLetter: 'A',
                            letters: 'ABCDER',
                            possibleChains: ['ACE', 'EAR', 'RED', 'DEAR', 'READ', 'BEAR', 'DARE', 'CARE', 'RACE']
                        },
                        {
                            startLetter: 'S',
                            letters: 'STOPMR',
                            possibleChains: ['STOP', 'TOP', 'POT', 'MOST', 'POST', 'SPORT', 'STORM']
                        },
                        {
                            startLetter: 'T',
                            letters: 'TRAINL',
                            possibleChains: ['TRAIN', 'RAIN', 'IN', 'TAIL', 'NAIL', 'TRAIL', 'ART', 'RAT']
                        },
                        {
                            startLetter: 'B',
                            letters: 'BLASTER',
                            possibleChains: ['BLAST', 'LAST', 'EAST', 'TABLE', 'STABLE', 'STAR', 'RATE']
                        },
                        {
                            startLetter: 'C',
                            letters: 'CHAINK',
                            possibleChains: ['CHAIN', 'HAIN', 'IN', 'NICK', 'KICK', 'THINK', 'THIN']
                        }
                    ]
                }
            },
            computed: {
                progressPercentage() {
                    if (this.gameMode === 'crossword') {
                        if (this.targetWords.length === 0) return 0;
                        return (this.foundWords.length / this.targetWords.length) * 100;
                    } else {
                        if (this.maxChainLength === 0) return 0;
                        return (this.chainWords.length / this.maxChainLength) * 100;
                    }
                },
                progressDisplay() {
                    if (this.gameMode === 'crossword') {
                        return `${this.foundWords.length}/${this.targetWords.length}`;
                    } else {
                        return `${this.chainWords.length}/${this.maxChainLength}`;
                    }
                },
                lastChainLetter() {
                    if (this.chainWords.length === 0) {
                        const levelData = this.wordChainDatabase[(this.currentLevel - 1) % this.wordChainDatabase.length];
                        return levelData ? levelData.startLetter : '';
                    }
                    const lastWord = this.chainWords[this.chainWords.length - 1];
                    return lastWord[lastWord.length - 1].toUpperCase();
                }
            },
            methods: {
                startGame() {
                    this.gameMode = this.selectedMode;
                    this.gameDifficulty = this.selectedDifficulty;
                    this.currentLevel = 1;
                    this.score = 0;
                    this.totalWordsFound = 0;
                    this.levelsCompleted = 0;
                    this.hintsUsed = 0;
                    this.gameOver = false;
                    this.showGameOver = false;
                    
                    const diffSettings = this.difficulties[this.gameDifficulty];
                    this.hints = diffSettings.hints;
                    this.maxLives = diffSettings.lives === Infinity ? 999 : diffSettings.lives;
                    this.currentLives = this.maxLives;
                    this.initialHints = this.hints;
                    
                    this.currentPage = 'game';
                    this.initLevel();
                },
                
                loseLife() {
                    if (this.gameDifficulty === 'practice') return;
                    
                    this.currentLives--;
                    
                    // Animate heart breaking
                    this.breakingHeartIndex = this.currentLives;
                    this.isShaking = true;
                    this.isFlashing = true;
                    
                    setTimeout(() => {
                        this.breakingHeartIndex = -1;
                        this.isShaking = false;
                        this.isFlashing = false;
                    }, 600);
                    
                    if (this.currentLives <= 0) {
                        this.gameOver = true;
                        this.showGameOver = true;
                        this.message = 'Game Over! You lost all your lives!';
                        this.messageType = 'error';
                    } else {
                        this.message = `Wrong! You lost a life! ${this.currentLives} lives remaining`;
                        this.messageType = 'warning';
                    }
                },
                
                exitToHome() {
                    this.finalScore = this.score;
                    this.finalStats = {
                        mode: this.gameMode,
                        difficulty: this.difficulties[this.gameDifficulty].label,
                        levelsCompleted: this.levelsCompleted,
                        totalWords: this.totalWordsFound,
                        hintsUsed: this.hintsUsed,
                        livesRemaining: this.currentLives,
                        performance: this.calculatePerformance()
                    };
                    this.showGameOver = false;
                    this.currentPage = 'finalScore';
                },
                
                calculatePerformance() {
                    const ratio = this.levelsCompleted > 0 ? 
                        (this.totalWordsFound / (this.levelsCompleted * 5)) * 100 : 0;
                    if (this.gameOver) return '💔 Game Over';
                    if (ratio >= 90) return '🌟 Excellent!';
                    if (ratio >= 70) return '👍 Good Job!';
                    if (ratio >= 50) return '📚 Keep Learning!';
                    return '💪 Need Practice!';
                },
                
                returnToHome() {
                    this.currentPage = 'welcome';
                    this.selectedMode = null;
                    this.selectedDifficulty = null;
                    this.gameMode = '';
                    this.gameDifficulty = '';
                    this.gameOver = false;
                    this.showGameOver = false;
                    this.resetGameData();
                },
                
                resetGameData() {
                    this.currentLevel = 1;
                    this.score = 0;
                    this.hints = 0;
                    this.maxLives = 5;
                    this.currentLives = 5;
                    this.initialHints = 0;
                    this.hintsUsed = 0;
                    this.totalWordsFound = 0;
                    this.levelsCompleted = 0;
                    this.mainWord = '';
                    this.scrambledLetters = [];
                    this.targetWords = [];
                    this.foundWords = [];
                    this.chainWords = [];
                    this.currentWord = [];
                    this.selectedIndices = [];
                    this.hintHighlightIndices = [];
                    this.hintLetterIndices = [];
                    this.message = '';
                    this.levelComplete = false;
                    this.breakingHeartIndex = -1;
                },
                
                initLevel() {
                    this.levelComplete = false;
                    this.foundWords = [];
                    this.chainWords = [];
                    this.currentWord = [];
                    this.selectedIndices = [];
                    this.hintHighlightIndices = [];
                    this.hintLetterIndices = [];
                    this.message = '';
                    
                    if (this.gameMode === 'crossword') {
                        this.initCrosswordLevel();
                    } else {
                        this.initWordChainLevel();
                    }
                },
                
                initCrosswordLevel() {
                    const levelData = this.crosswordDatabase[(this.currentLevel - 1) % this.crosswordDatabase.length];
                    this.mainWord = levelData.mainWord;
                    this.targetWords = [...levelData.words];
                    this.scrambleLetters();
                },
                
                initWordChainLevel() {
                    const levelData = this.wordChainDatabase[(this.currentLevel - 1) % this.wordChainDatabase.length];
                    this.mainWord = levelData.letters;
                    this.targetWords = [...levelData.possibleChains];
                    
                    switch(this.gameDifficulty) {
                        case 'practice':
                            this.maxChainLength = 8;
                            break;
                        case 'easy':
                            this.maxChainLength = 6;
                            break;
                        case 'normal':
                            this.maxChainLength = 5;
                            break;
                        case 'hard':
                            this.maxChainLength = 4;
                            break;
                    }
                    
                    this.scrambleLetters();
                },
                
                scrambleLetters() {
                    let letters = this.mainWord.split('');
                    for (let i = letters.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [letters[i], letters[j]] = [letters[j], letters[i]];
                    }
                    this.scrambledLetters = letters;
                },
                
                selectLetter(index) {
                    // REMOVED: if (this.usedLetters.includes(index)) return;
                    // Now letters can always be selected again!
                    
                    if (this.selectedIndices.includes(index)) {
                        // If already selected, deselect it
                        const selectedPos = this.selectedIndices.indexOf(index);
                        this.selectedIndices.splice(selectedPos, 1);
                        this.currentWord.splice(selectedPos, 1);
                    } else {
                        // Select this letter
                        this.selectedIndices.push(index);
                        this.currentWord.push(this.scrambledLetters[index]);
                    }
                    
                    // Clear hint highlights when user interacts
                    this.hintHighlightIndices = [];
                    this.hintLetterIndices = [];
                },
                
                clearSelection() {
                    this.currentWord = [];
                    this.selectedIndices = [];
                    this.hintHighlightIndices = [];
                    this.hintLetterIndices = [];
                    this.message = '';
                },
                
                checkWord() {
                    const word = this.currentWord.join('').toUpperCase();
                    
                    if (this.gameMode === 'crossword') {
                        this.checkCrosswordWord(word);
                    } else {
                        this.checkWordChainWord(word);
                    }
                    
                    // Clear if success, keep if error so user can see the mistake
                    if (this.messageType === 'success') {
                        setTimeout(() => {
                            this.clearSelection();
                        }, 800);
                    }
                },
                
                checkCrosswordWord(word) {
                    if (this.foundWords.includes(word)) {
                        this.message = 'Word already found!';
                        this.messageType = 'error';
                        this.loseLife();
                    } else if (this.targetWords.includes(word)) {
                        this.foundWords.push(word);
                        this.score += word.length * 10;
                        this.totalWordsFound++;
                        this.message = `Great! "${word}" is correct! (+${word.length * 10} points)`;
                        this.messageType = 'success';
                        
                        if (this.foundWords.length === this.targetWords.length) {
                            this.levelComplete = true;
                            this.levelsCompleted++;
                            this.message = '';
                        }
                    } else {
                        this.message = `"${word}" is not in the word list`;
                        this.messageType = 'error';
                        this.loseLife();
                    }
                },
                
                checkWordChainWord(word) {
                    if (this.chainWords.includes(word)) {
                        this.message = 'Word already used in chain!';
                        this.messageType = 'error';
                        this.loseLife();
                        return;
                    }
                    
                    if (!this.targetWords.includes(word)) {
                        this.message = `"${word}" is not a valid word`;
                        this.messageType = 'error';
                        this.loseLife();
                        return;
                    }
                    
                    if (this.chainWords.length > 0) {
                        const requiredStartLetter = this.lastChainLetter;
                        if (word[0] !== requiredStartLetter) {
                            this.message = `Word must start with letter "${requiredStartLetter}"`;
                            this.messageType = 'error';
                            this.loseLife();
                            return;
                        }
                    } else {
                        const levelData = this.wordChainDatabase[(this.currentLevel - 1) % this.wordChainDatabase.length];
                        if (word[0] !== levelData.startLetter) {
                            this.message = `First word must start with letter "${levelData.startLetter}"`;
                            this.messageType = 'error';
                            this.loseLife();
                            return;
                        }
                    }
                    
                    this.chainWords.push(word);
                    this.score += word.length * 15;
                    this.totalWordsFound++;
                    this.message = `Chain extended! "${word}" added (+${word.length * 15} points)`;
                    this.messageType = 'success';
                    
                    if (this.chainWords.length >= this.maxChainLength) {
                        this.levelComplete = true;
                        this.levelsCompleted++;
                        this.message = '';
                    }
                },
                
                useHint() {
                    if (this.gameDifficulty !== 'practice') {
                        if (this.hints <= 0) return;
                        this.hints--;
                        this.hintsUsed++;
                    }
                    
                    this.hintHighlightIndices = [];
                    this.hintLetterIndices = [];
                    
                    if (this.gameMode === 'crossword') {
                        this.crosswordHint();
                    } else {
                        this.wordChainHint();
                    }
                },
                
                crosswordHint() {
                    const unfoundWords = this.targetWords.filter(word => !this.foundWords.includes(word));
                    
                    if (unfoundWords.length > 0) {
                        const hintWord = unfoundWords[Math.floor(Math.random() * unfoundWords.length)];
                        
                        if (this.currentWord.length > 0) {
                            // User already has some letters, try to extend
                            const currentPrefix = this.currentWord.join('').toUpperCase();
                            const matchingWords = unfoundWords.filter(w => w.startsWith(currentPrefix));
                            
                            if (matchingWords.length > 0) {
                                const matchWord = matchingWords[0];
                                this.extendCurrentWord(matchWord);
                                this.message = `Hint: Continue with "${matchWord}"`;
                            } else {
                                // No matching continuation, suggest new word
                                this.message = `Hint: Try a ${hintWord.length}-letter word starting with "${hintWord[0]}"`;
                                this.highlightFirstLetter(hintWord);
                            }
                        } else {
                            this.message = `Hint: Try a ${hintWord.length}-letter word starting with "${hintWord[0]}"`;
                            this.highlightFirstLetter(hintWord);
                        }
                        
                        this.messageType = 'info';
                    }
                },
                
                wordChainHint() {
                    const unusedWords = this.targetWords.filter(word => !this.chainWords.includes(word));
                    
                    if (unusedWords.length > 0) {
                        let hintWord;
                        if (this.chainWords.length === 0) {
                            const levelData = this.wordChainDatabase[(this.currentLevel - 1) % this.wordChainDatabase.length];
                            hintWord = unusedWords.find(w => w[0] === levelData.startLetter);
                        } else {
                            hintWord = unusedWords.find(w => w[0] === this.lastChainLetter);
                        }
                        
                        if (hintWord) {
                            if (this.currentWord.length > 0) {
                                const currentPrefix = this.currentWord.join('').toUpperCase();
                                if (hintWord.startsWith(currentPrefix)) {
                                    this.extendCurrentWord(hintWord);
                                    this.message = `Hint: Continue with "${hintWord}"`;
                                } else {
                                    this.message = `Hint: Try "${hintWord}" starting with "${hintWord[0]}"`;
                                    this.highlightFirstLetter(hintWord);
                                }
                            } else {
                                this.message = `Hint: Try "${hintWord}" starting with "${hintWord[0]}"`;
                                this.highlightFirstLetter(hintWord);
                            }
                            this.messageType = 'info';
                        }
                    }
                },
                
                extendCurrentWord(fullWord) {
                    // Add remaining letters to current selection
                    const currentLength = this.currentWord.length;
                    const remainingLetters = fullWord.substring(currentLength).split('');
                    
                    remainingLetters.forEach(letter => {
                        // Find ANY available letter (even if already used before)
                        const availableIndex = this.scrambledLetters.findIndex((l, i) => 
                            l === letter && !this.selectedIndices.includes(i)
                        );
                        
                        if (availableIndex !== -1) {
                            this.selectedIndices.push(availableIndex);
                            this.currentWord.push(this.scrambledLetters[availableIndex]);
                            this.hintHighlightIndices.push(availableIndex);
                            this.hintLetterIndices.push(this.currentWord.length - 1);
                        }
                    });
                    
                    setTimeout(() => {
                        this.hintHighlightIndices = [];
                        this.hintLetterIndices = [];
                    }, 1500);
                },
                
                highlightFirstLetter(hintWord) {
                    // Highlight first letter of the hint word
                    const firstLetter = hintWord[0];
                    const availableIndex = this.scrambledLetters.findIndex((l, i) => 
                        l === firstLetter && !this.selectedIndices.includes(i)
                    );
                    
                    if (availableIndex !== -1) {
                        this.hintHighlightIndices = [availableIndex];
                        setTimeout(() => {
                            this.hintHighlightIndices = [];
                        }, 1500);
                    }
                },
                
                nextLevel() {
                    this.currentLevel++;
                    if (this.gameDifficulty !== 'practice') {
                        this.hints = this.difficulties[this.gameDifficulty].hints;
                    }
                    this.initLevel();
                }
            }
        };

        const app = createApp({
            components: {
                WordPuzzleGame
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
